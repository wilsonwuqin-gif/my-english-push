name: daily-english

on:
  schedule:
    # GitHub Actions 用 UTC 时间。UTC 23:00 = 北京时间次日 07:00
    - cron: '0 23 * * *'
  workflow_dispatch:        # 允许在网页上手动触发（测试用）
    inputs:
      force_day:
        description: '强制按第几天推送（起始日之前测试用，留空则按真实日期）'
        required: false
        default: ''

# 让工作流有权限往仓库里写（保活提交需要）
permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install edge-tts

      # 第 1 步：调 AI 生成卡片，并用 edge-tts 合成朗读音频
      - name: 生成内容与音频
        run: python push.py generate
        env:
          PROVIDER:          deepseek        # 想换回 Claude 就改成 claude
          FORCE_DAY:         ${{ inputs.force_day }}
          GH_REPO:           ${{ github.repository }}
          DEEPSEEK_API_KEY:  ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # 第 2 步：把音频提交上去，jsDelivr 才能取到文件
      # （顺带充当保活提交，防止仓库 60 天无提交被停用定时任务）
      - name: 提交音频
        run: |
          date -u +"last run: %Y-%m-%d %H:%M UTC" > last_run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A audio last_run.txt
          git commit -m "day audio + keepalive" || exit 0
          git push

      # 第 3 步：音频已在线，再推微信
      - name: 推送到微信
        run: python push.py send
        env:
          FORCE_DAY:         ${{ inputs.force_day }}
          GH_REPO:           ${{ github.repository }}
          PUSHPLUS_TOKEN:    ${{ secrets.PUSHPLUS_TOKEN }}
