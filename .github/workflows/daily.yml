name: daily-english

on:
  schedule:
    # GitHub Actions 用 UTC 时间。UTC 23:00 = 北京时间次日 07:00
    - cron: '0 23 * * *'
  workflow_dispatch:        # 允许在网页上手动触发（测试用）

# 让工作流有权限往仓库里写（保活提交需要）
permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成并推送今日英语
        run: python push.py
        env:
          PROVIDER:          deepseek        # 想换回 Claude 就改成 claude
          PUSHPLUS_TOKEN:    ${{ secrets.PUSHPLUS_TOKEN }}
          DEEPSEEK_API_KEY:  ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # 防止仓库 60 天无提交导致 GitHub 自动停用定时任务
      - name: 保活提交
        run: |
          date -u +"last run: %Y-%m-%d %H:%M UTC" > last_run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_run.txt
          git commit -m "keepalive" || exit 0
          git push
